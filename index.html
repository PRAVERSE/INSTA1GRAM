<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Insta1gram</title>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fff;
            --fg: #000;
            --mute: #737373;
            --line: #dbdbdb;
            --blue: #0095f6;
            --red: #ed4956;
            --hover: #f2f2f2;
            color-scheme: light;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #000000;
                --fg: #f5f5f5;
                --mute: #a8a8a8;
                --line: #262626;
                --hover: #121212;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #000000;
            --fg: #f5f5f5;
            --mute: #a8a8a8;
            --line: #262626;
            --hover: #121212;
            color-scheme: dark
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px
        }

        button {
            font: inherit;
            color: inherit;
            background: none;
            border: 0;
            cursor: pointer
        }

        svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: block
        }

        .logo {
            font-family: "Grand Hotel", "Brush Script MT", cursive;
            font-size: 30px;
            line-height: 1
        }

        .layout {
            display: flex;
            min-height: 100vh
        }

        .side {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 244px;
            padding: 12px;
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            background: var(--bg);
            z-index: 5
        }

        .side .logo {
            padding: 24px 12px 20px;
            font-size: 32px
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            margin: 2px 0;
            border-radius: 8px;
            font-size: 16px;
            width: 100%;
            text-align: left
        }

        .nav:hover {
            background: var(--hover)
        }

        .nav.on {
            font-weight: 700
        }

        .nav.on svg {
            stroke-width: 2.6
        }

        .nav .av {
            width: 24px;
            height: 24px
        }

        .side .more {
            margin-top: auto
        }

        .main {
            margin-left: 244px;
            flex: 1;
            display: flex;
            justify-content: center;
            gap: 64px;
            padding: 24px 16px
        }

        .col {
            width: 100%;
            max-width: 470px
        }

        .stories {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 4px 0 16px;
            scrollbar-width: none
        }

        .stories::-webkit-scrollbar {
            display: none
        }

        .story {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 66px;
            flex: none;
            font-size: 12px
        }

        .story span {
            max-width: 66px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .ring {
            padding: 2.5px;
            border-radius: 50%;
            background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5)
        }

        .ring.seen {
            background: var(--line)
        }

        .ring .av {
            border: 2.5px solid var(--bg)
        }

        .av {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 700;
            font-size: 18px;
            flex: none
        }

        .sm {
            width: 32px;
            height: 32px;
            font-size: 13px
        }

        .post {
            border-bottom: 1px solid var(--line);
            padding-bottom: 12px;
            margin-bottom: 20px
        }

        .ph {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0
        }

        .ph .ring {
            padding: 2px
        }

        .ph .ring .av {
            border-width: 2px
        }

        .ph b {
            font-weight: 600
        }

        .ph .t {
            color: var(--mute)
        }

        .ph .dots {
            margin-left: auto
        }

        .media {
            width: 100%;
            aspect-ratio: 4/5;
            border-radius: 4px;
            border: 1px solid var(--line);
            position: relative;
            display: grid;
            place-items: center;
            font-size: 150px;
            overflow: hidden;
            user-select: none
        }

        .heart-pop {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            pointer-events: none
        }

        .heart-pop svg {
            width: 96px;
            height: 96px;
            fill: #fff;
            stroke: #fff;
            opacity: 0;
            transform: scale(.6)
        }

        .heart-pop.go svg {
            animation: pop .8s ease
        }

        @keyframes pop {
            15% {
                opacity: 1;
                transform: scale(1.15)
            }

            30% {
                transform: scale(.95)
            }

            70% {
                opacity: 1;
                transform: scale(1)
            }

            100% {
                opacity: 0;
                transform: scale(1)
            }
        }

        .acts {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 0 4px
        }

        .acts button {
            padding: 6px 8px 6px 0
        }

        .acts button:hover {
            opacity: .6
        }

        .acts .save {
            margin-left: auto;
            padding-right: 0
        }

        .liked svg {
            fill: var(--red);
            stroke: var(--red)
        }

        .saved svg {
            fill: currentColor
        }

        .likes {
            margin: 2px 0 6px
        }

        .likes b {
            font-weight: 600
        }

        .cap b {
            font-weight: 600;
            margin-right: 4px
        }

        .cap .more {
            color: var(--mute)
        }

        .vc {
            color: var(--mute);
            margin-top: 6px;
            display: block
        }

        .cl {
            margin-top: 6px
        }

        .cl div {
            margin-top: 3px
        }

        .cl b {
            margin-right: 4px;
            font-weight: 600
        }

        .add {
            display: flex;
            align-items: center;
            margin-top: 8px;
            border-top: 1px solid transparent
        }

        .add input {
            flex: 1;
            background: none;
            border: 0;
            outline: 0;
            color: var(--fg);
            font: inherit;
            padding: 6px 0
        }

        .add button {
            color: var(--blue);
            font-weight: 600;
            opacity: .5
        }

        .add button.on {
            opacity: 1
        }

        .right {
            width: 319px;
            padding-top: 12px
        }

        .me {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px
        }

        .me .sw {
            margin-left: auto;
            color: var(--blue);
            font-size: 12px;
            font-weight: 600
        }

        .sh {
            display: flex;
            justify-content: space-between;
            color: var(--mute);
            font-weight: 600;
            margin-bottom: 10px
        }

        .sh button {
            color: var(--fg);
            font-size: 12px
        }

        .sg {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 10px 0
        }

        .sg small {
            display: block;
            color: var(--mute);
            font-size: 12px
        }

        .sg .f {
            margin-left: auto;
            color: var(--blue);
            font-size: 12px;
            font-weight: 600
        }

        .sg .f.on {
            color: var(--mute)
        }

        .foot {
            color: var(--mute);
            font-size: 11px;
            margin-top: 28px;
            line-height: 1.8
        }

        .top,
        .bot {
            display: none
        }

        body.out .layout,
        body.out .bot {
            display: none !important
        }

        .login {
            display: none;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            padding: 20px
        }

        body.out .login {
            display: flex
        }

        .lc {
            width: 100%;
            max-width: 350px;
            border: 1px solid var(--line);
            padding: 30px 40px 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center
        }

        .lc .logo {
            font-size: 52px;
            margin: 6px 0 20px
        }

        .lc input {
            width: 100%;
            background: var(--hover);
            border: 1px solid var(--line);
            border-radius: 3px;
            padding: 10px 8px;
            color: var(--fg);
            font: inherit;
            font-size: 13px;
            outline: 0
        }

        .lc input:focus {
            border-color: var(--mute)
        }

        .lc .go {
            background: var(--blue);
            color: #fff;
            font-weight: 600;
            border-radius: 8px;
            padding: 8px;
            margin-top: 8px
        }

        .lc .go:disabled {
            opacity: .4;
            cursor: default
        }

        .lc .err {
            color: var(--red);
            font-size: 13px;
            min-height: 18px;
            margin-top: 6px
        }

        .lc .or {
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--mute);
            font-weight: 600;
            font-size: 13px;
            margin: 12px 0
        }

        .lc .or::before,
        .lc .or::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--line)
        }

        .lc .fb {
            color: #385185;
            font-weight: 600;
            font-size: 14px
        }

        .lc small {
            color: var(--mute);
            font-size: 12px;
            margin-top: 10px
        }

        .lc2 {
            width: 100%;
            max-width: 350px;
            border: 1px solid var(--line);
            padding: 20px;
            text-align: center
        }

        .lc2 button {
            color: var(--blue);
            font-weight: 600
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%);
            background: var(--fg);
            color: var(--bg);
            padding: 10px 18px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity .2s;
            pointer-events: none;
            z-index: 20
        }

        .toast.show {
            opacity: 1
        }

        @media(max-width:1160px) {
            .right {
                display: none
            }
        }

        @media(max-width:900px) {
            .side {
                width: 72px;
                align-items: center
            }

            .side .logo {
                font-size: 0;
                padding: 24px 0
            }

            .side .logo::before {
                content: "1";
                font-size: 30px
            }

            .nav span {
                display: none
            }

            .nav {
                justify-content: center;
                width: auto
            }

            .main {
                margin-left: 72px
            }
        }

        @media(max-width:640px) {
            .side {
                display: none
            }

            .main {
                margin: 0;
                padding: 0 12px 70px
            }

            .top {
                display: flex;
                position: sticky;
                top: env(safe-area-inset-top, 0px);
                background: var(--bg);
                align-items: center;
                justify-content: space-between;
                padding: 10px 12px;
                border-bottom: 1px solid var(--line);
                z-index: 6
            }

            .bot {
                display: flex;
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                justify-content: space-around;
                align-items: center;
                background: var(--bg);
                border-top: 1px solid var(--line);
                padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px));
                z-index: 6
            }

            .bot .av {
                width: 24px;
                height: 24px
            }

            .stories {
                margin: 0 -12px;
                padding: 12px
            }
        }

        .si {
            width: 100%;
            background: var(--hover);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--fg);
            font: inherit;
            outline: 0;
            margin-bottom: 12px;
            resize: none;
            display: block
        }

        .mu {
            color: var(--mute);
            padding: 12px 0
        }

        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 6px;
            border-radius: 8px;
            cursor: pointer
        }

        .row:hover {
            background: var(--hover)
        }

        .row small,
        .nt small {
            display: block;
            color: var(--mute);
            font-size: 12px
        }

        .nt small {
            display: inline
        }

        .pill {
            background: var(--hover);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 6px 12px;
            font-weight: 600;
            font-size: 13px
        }

        .row .pill {
            margin-left: auto
        }

        .pill.ok {
            color: var(--mute)
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px
        }

        .tile {
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            font-size: 44px;
            cursor: pointer
        }

        .pf {
            display: flex;
            gap: 28px;
            align-items: center;
            padding: 8px 0 20px
        }

        .big2 {
            width: 84px;
            height: 84px;
            font-size: 32px
        }

        .pn {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap
        }

        .pn h2 {
            font-size: 20px;
            font-weight: 400
        }

        .st {
            display: flex;
            gap: 20px;
            margin-top: 12px
        }

        .sub {
            font-size: 14px;
            font-weight: 600;
            margin: 16px 0 8px
        }

        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .chip {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 4px 12px 4px 4px;
            cursor: pointer
        }

        .reels {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center
        }

        .reel {
            position: relative;
            width: 100%;
            max-width: 360px;
            aspect-ratio: 9/16;
            border-radius: 8px;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: #fff
        }

        .reel .big {
            font-size: 96px
        }

        .reel .ov {
            position: absolute;
            left: 12px;
            right: 70px;
            bottom: 14px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .5)
        }

        .reel .side2 {
            position: absolute;
            right: 10px;
            bottom: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 12px
        }

        .chh {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--line)
        }

        .msgs {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px 0;
            max-height: 55vh;
            min-height: 200px;
            overflow: auto
        }

        .bub {
            background: var(--hover);
            padding: 8px 12px;
            border-radius: 18px;
            max-width: 75%;
            align-self: flex-start;
            word-break: break-word
        }

        .bub.me {
            background: var(--blue);
            color: #fff;
            align-self: flex-end
        }

        .nt {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0
        }

        .pk {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 2px solid transparent;
            font-size: 22px
        }

        .pk.sel {
            border-color: var(--blue)
        }

        .pkr {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px
        }

        h2.t2 {
            font-size: 20px;
            margin-bottom: 12px
        }

        .right .row {
            padding: 4px 6px
        }

        .col.wide {
            max-width: 900px
        }

        body.dmv .right {
            display: none
        }

        .dm {
            display: grid;
            grid-template-columns: 340px 1fr;
            height: calc(100vh - 48px);
            overflow: hidden
        }

        .dl {
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            min-height: 0
        }

        .dlh {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            font-size: 16px
        }

        .tabs {
            display: flex
        }

        .tabs button {
            flex: 1;
            padding: 10px;
            color: var(--mute);
            font-weight: 600;
            border-bottom: 2px solid transparent
        }

        .tabs .on {
            color: var(--fg);
            border-color: var(--fg)
        }

        .cl2 {
            overflow: auto;
            flex: 1
        }

        .row.act {
            background: var(--hover)
        }

        .rt {
            min-width: 0;
            flex: 1
        }

        .rt small {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--blue);
            flex: none
        }

        .dc {
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100%;
            position: relative
        }

        .dc.empty {
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 8px;
            color: var(--mute)
        }

        .go2 {
            background: var(--blue);
            color: #fff;
            font-weight: 600;
            border-radius: 8px;
            padding: 8px 16px;
            margin-top: 6px
        }

        .go2:disabled {
            opacity: .4
        }

        .dch {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px
        }

        .hl {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer
        }

        .hl small {
            display: block;
            color: var(--mute);
            font-size: 12px
        }

        .hr {
            margin-left: auto;
            display: flex;
            gap: 14px
        }

        .bk {
            display: none;
            font-size: 20px
        }

        .dm .msgs {
            flex: 1;
            max-height: none;
            min-height: 0;
            padding: 12px 16px;
            gap: 4px
        }

        .mw {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            max-width: 75%
        }

        .mw.me {
            align-self: flex-end;
            align-items: flex-end
        }

        .bwrap {
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative
        }

        .mw.me .bwrap {
            flex-direction: row-reverse
        }

        .dm .bub {
            max-width: 100%;
            white-space: pre-wrap
        }

        .mw.me .bub {
            background: linear-gradient(135deg, #7a4dff, #3b82f6);
            color: #fff
        }

        .dm .bub.big {
            font-size: 32px;
            background: none !important;
            padding: 0
        }

        .bub img {
            max-width: 240px;
            width: 100%;
            border-radius: 12px;
            display: block
        }

        .qt {
            font-size: 12px;
            color: var(--mute);
            border-left: 2px solid var(--line);
            padding: 2px 8px;
            margin-bottom: 2px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .tools {
            display: none;
            gap: 2px
        }

        .mw:hover .tools,
        .mw:focus-within .tools {
            display: flex
        }

        .tools button {
            padding: 4px;
            color: var(--mute);
            font-size: 14px
        }

        .pp {
            position: absolute;
            top: 100%;
            z-index: 4;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 6px;
            display: flex;
            gap: 4px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .2)
        }

        .mw.me .pp {
            right: 0
        }

        .pp.mn {
            flex-direction: column;
            gap: 0
        }

        .pp button {
            padding: 6px 12px;
            text-align: left;
            font-size: 14px;
            white-space: nowrap
        }

        .pp.rxs button {
            font-size: 20px;
            padding: 2px 6px
        }

        .rx {
            font-size: 12px;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 0 5px;
            margin-top: -6px;
            z-index: 1
        }

        .stt {
            font-size: 11px;
            color: var(--mute);
            margin: 2px 4px
        }

        .vm {
            display: flex;
            gap: 8px;
            align-items: center;
            min-width: 140px
        }

        .tb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 16px 16px;
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 6px 12px;
            position: relative
        }

        .tb textarea {
            flex: 1;
            background: none;
            border: 0;
            outline: 0;
            color: var(--fg);
            font: inherit;
            resize: none;
            max-height: 120px;
            padding: 6px 0;
            line-height: 20px;
            height: 32px
        }

        .tb button {
